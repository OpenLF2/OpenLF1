name: Upload to latest release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to take the last successful build from
        default: main
        required: true

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find last successful build
        id: build
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow build.yml --branch "${{ inputs.branch }}" \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful build found on ${{ inputs.branch }}"
            exit 1
          fi
          echo "build.yml -> run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download artifacts of last successful build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Upload to latest release
        run: |
          set -euo pipefail
          if ! tag=$(gh release view --json tagName -q .tagName); then
            echo "::error::No release found"
            exit 1
          fi
          echo "Uploading to release $tag"
          mapfile -d '' files < <(find artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            gh release upload "$tag" "$file" --clobber
          done
          echo "Uploaded ${#files[@]} files to $tag"
